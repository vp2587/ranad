<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ระนาด">
<meta name="theme-color" content="#120405">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<title>Ranad Ek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Sans+Thai:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg-top: #3A0D12;
    --bg-bottom: #120405;
    --panel: #24090C;
    --gold: #E2B34A;
    --cream: #F7EBD3;
    --cream-dim: #CDB9A0;
    --chip: rgba(247, 235, 211, 0.08);
    --line: rgba(226, 179, 74, 0.35);
    --ui: "IBM Plex Sans Thai", -apple-system, "Segoe UI", system-ui, sans-serif;
    --display: "Chonburi", "Thonburi", Georgia, serif;
  }
  html, body { height: 100%; }
  body {
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    background-color: var(--bg-bottom);
    color: var(--cream);
    font-family: var(--ui);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px 4px;
    box-sizing: border-box;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .name { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .name h1 { margin: 0; font: 400 22px/1.2 var(--display); color: var(--gold); }
  .name span { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cream-dim); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 600 13px/1 var(--ui);
    color: var(--cream);
    background: var(--chip);
    border: 1px solid rgba(226, 179, 74, 0.55);
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chip[aria-pressed="true"] { background: var(--gold); color: var(--bg-bottom); border-color: var(--gold); }
  .chip:focus-visible, .panel button:focus-visible, .panel input:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
  .stage { position: relative; flex: 1; min-height: 0; margin-top: 6px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .start {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(18, 4, 5, 0.55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .start button {
    display: grid; gap: 6px; justify-items: center;
    font: 600 17px/1.3 var(--ui);
    color: var(--bg-bottom);
    background: var(--gold);
    border: 0; border-radius: 18px;
    padding: 18px 28px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .start button small { font-weight: 500; font-size: 13px; opacity: 0.8; }

  .panel {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: min(300px, 100%);
    box-sizing: border-box;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
    touch-action: pan-y;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel h2 { margin: 0; font: 600 15px/1.2 var(--ui); color: var(--gold); }
  .panel p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--cream-dim); }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .slider label { font-size: 13px; font-weight: 600; }
  .slider output { font-size: 12px; color: var(--cream-dim); font-variant-numeric: tabular-nums; }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); margin: 2px 0 0; }
  .panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .panel .small { font: 600 12px/1 var(--ui); padding: 8px 10px; }
  .file-label { position: relative; overflow: hidden; }
  .file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .status { font-size: 12px; color: var(--cream); min-height: 1.2em; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="name"><h1>ระนาดเอก</h1><span>Ranad Ek</span></div>
    <div class="controls">
      <button class="chip" id="labels" aria-pressed="true">Labels</button>
      <button class="chip" id="script" aria-pressed="true">ไทย</button>
      <button class="chip" id="octaves" aria-pressed="false">Octaves</button>
      <button class="chip" id="kro" aria-pressed="false">Kro</button>
      <button class="chip" id="tuning" aria-pressed="false">Thai tuning</button>
      <button class="chip" id="soundChip" aria-pressed="false" aria-controls="panel">Sound</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="ranad" aria-label="Ranad ek with 22 wooden bars. Tap a bar to play it."></canvas>

    <div class="panel" id="panel" hidden>
      <div class="panel-head">
        <h2>Sound</h2>
        <button class="chip small" id="closePanel">Done</button>
      </div>
      <p>Play the bars on the left while you adjust.</p>

      <div class="slider">
        <label for="pitch">Pitch</label><output id="pitchOut"></output>
        <input type="range" id="pitch" min="-12" max="12" step="1">
      </div>
      <div class="slider">
        <label for="bright">Mallet hardness</label><output id="brightOut"></output>
        <input type="range" id="bright" min="0" max="100" step="1">
      </div>
      <div class="slider">
        <label for="ring">Ring length</label><output id="ringOut"></output>
        <input type="range" id="ring" min="0" max="100" step="1">
      </div>
      <div class="slider">
        <label for="knock">Wood knock</label><output id="knockOut"></output>
        <input type="range" id="knock" min="0" max="100" step="1">
      </div>
      <div class="slider">
        <label for="echo">Room echo</label><output id="echoOut"></output>
        <input type="range" id="echo" min="0" max="100" step="1">
      </div>
      <div class="row">
        <button class="chip small" id="resetSound">Reset sound</button>
      </div>

      <hr>
      <h2>Use a real recording</h2>
      <p>Pick an audio file of one ranad note: a single strike with a little silence around it. The app finds its pitch and plays it on every bar.</p>
      <div class="row">
        <span class="chip small file-label">Choose recording…<input type="file" id="sampleFile" accept="audio/*"></span>
        <button class="chip small" id="clearSample" hidden>Use built-in sound</button>
      </div>
      <div class="status" id="sampleStatus" role="status"></div>
    </div>

    <div class="start" id="start">
      <button id="startButton">Tap to start playing<small>Works with silent mode on. If you hear nothing, turn up the volume.</small></button>
    </div>
  </div>
</div>

<script>
(() => {
  // 22 bars: ช ล ท ด ร ม ฟ three times, then a fourth ช on top.
  const BAR_COUNT = 22;
  const THAI_NAMES = ["ช", "ล", "ท", "ด", "ร", "ม", "ฟ"];
  const LATIN_NAMES = ["Sol", "La", "Ti", "Do", "Re", "Mi", "Fa"];
  const THAI_LOWEST = 165;      // lowest ช in Thai tuning
  const WESTERN_LOWEST = 196;   // G3 in Western tuning
  const FROM_SOL = [0, 2, 4, 5, 7, 9, 10]; // G A B C D E F
  const COLORS = {
    gold: "#E2B34A", cream: "#F7EBD3",
    barDark: "#6B3419", barMid: "#9C5630", barLight: "#C98552", cord: "#2A1A10"
  };
  const DEFAULT_SOUND = { pitch: 0, bright: 100, ring: 40, knock: 20, echo: 9 };

  // ---------- Settings ----------
  const settings = { labels: true, thai: true, octaves: true, kro: true, western: false, sound: { ...DEFAULT_SOUND } };
  try {
    const stored = JSON.parse(localStorage.getItem("ranad-settings-v3") || "{}");
    Object.assign(settings, stored, { sound: { ...DEFAULT_SOUND, ...(stored.sound || {}) } });
  } catch (e) {}
  const save = () => { try { localStorage.setItem("ranad-settings-v3", JSON.stringify(settings)); } catch (e) {} };

  const $ = (id) => document.getElementById(id);
  const chips = { labels: $("labels"), script: $("script"), octaves: $("octaves"), kro: $("kro"), tuning: $("tuning"), sound: $("soundChip") };
  function syncChips() {
    chips.labels.setAttribute("aria-pressed", settings.labels);
    chips.script.hidden = !settings.labels;
    chips.script.textContent = settings.thai ? "ไทย" : "ABC";
    chips.octaves.setAttribute("aria-pressed", settings.octaves);
    chips.kro.setAttribute("aria-pressed", settings.kro);
    chips.tuning.textContent = settings.western ? "Western tuning" : "Thai tuning";
    chips.tuning.setAttribute("aria-pressed", settings.western);
    chips.sound.setAttribute("aria-pressed", !$("panel").hidden);
  }
  const toggle = (key) => () => { settings[key] = !settings[key]; save(); syncChips(); draw(); };
  chips.labels.onclick = toggle("labels");
  chips.script.onclick = toggle("thai");
  chips.octaves.onclick = toggle("octaves");
  chips.kro.onclick = toggle("kro");
  chips.tuning.onclick = () => { toggle("western")(); prerender(); };
  chips.sound.onclick = () => { $("panel").hidden = !$("panel").hidden; syncChips(); };
  $("closePanel").onclick = () => { $("panel").hidden = true; syncChips(); };

  function frequency(bar) {
    const shift = Math.pow(2, settings.sound.pitch / 12);
    if (!settings.western) return THAI_LOWEST * shift * Math.pow(2, bar / 7);
    const semis = FROM_SOL[bar % 7] + 12 * Math.floor(bar / 7);
    return WESTERN_LOWEST * shift * Math.pow(2, semis / 12);
  }

  // ---------- Audio ----------
  // Built-in sound: each note is rendered once from a model of a struck wooden bar.
  // Recording mode: one real note, re-pitched for every bar.
  let ctx = null, master = null, wet = null;
  let noteCache = new Map();
  const lastVoice = new Map();
  let sample = null; // { buffer, pitch, name }

  const lerp = (a, b, t) => a + (b - a) * t;

  function renderBar(freq, sr, p) {
    const bright = p.bright / 100, ring = p.ring / 100, knock = p.knock / 100;
    // Wood is heavily damped: the tone dies quickly and the overtones die almost at once,
    // so they color the strike instead of ringing on like a bell.
    const modes = [
      [1.00, 1.00, 1.00],
      [2.76, 0.20 + 0.40 * bright, 0.18],
      [5.40, 0.05 + 0.20 * bright, 0.08],
      [8.93, 0.10 * bright, 0.04]
    ];
    const tau0 = Math.max(0.03, Math.min(0.8, lerp(0.05, 0.5, ring) * Math.pow(165 / freq, 0.6)));
    const len = Math.ceil(sr * (tau0 * 5 + 0.08));
    const out = new Float32Array(len);

    // Excitation: a half-sine mallet pulse (shorter = harder mallet) with a little
    // roughness from wood hitting wood.
    const pulseLen = Math.max(2, Math.ceil(lerp(0.0016, 0.0003, bright) * sr));
    const exc = new Float32Array(pulseLen + Math.ceil(0.005 * sr));
    for (let n = 0; n < pulseLen; n++) exc[n] = Math.sin(Math.PI * n / pulseLen);
    for (let n = 0; n < exc.length; n++) exc[n] += (Math.random() * 2 - 1) * 0.3 * Math.exp(-n / (0.0012 * sr));

    // Each mode is a two-pole resonator driven by the excitation.
    let fundamentalPeak = 0;
    modes.forEach(([ratio, level, decay], i) => {
      const f = freq * ratio;
      if (f > sr * 0.45 || level <= 0) return;
      const w = 2 * Math.PI * f / sr, r = Math.exp(-1 / (tau0 * decay * sr));
      const a1 = 2 * r * Math.cos(w), a2 = -r * r, b0 = level * Math.sin(w);
      let y1 = 0, y2 = 0;
      for (let n = 0; n < len; n++) {
        const y = b0 * (n < exc.length ? exc[n] : 0) + a1 * y1 + a2 * y2;
        y2 = y1; y1 = y;
        out[n] += y;
        if (i === 0) fundamentalPeak = Math.max(fundamentalPeak, Math.abs(y));
        if (n > exc.length && Math.abs(y1) + Math.abs(y2) < 1e-7) break;
      }
    });
    const norm = 1 / (fundamentalPeak || 1);
    for (let n = 0; n < len; n++) out[n] *= norm;

    // The dry "tok" of the strike and the hollow knock of the frame: short band-passed noise.
    const burst = (fc, q, peakLevel, tau) => {
      if (peakLevel <= 0) return;
      const n0 = Math.min(len, Math.ceil(tau * 8 * sr));
      const tmp = new Float32Array(n0);
      const w0 = 2 * Math.PI * fc / sr, r = Math.exp(-w0 / (2 * q));
      const a1 = 2 * r * Math.cos(w0), a2 = -r * r;
      let y1 = 0, y2 = 0, peak = 0;
      for (let n = 0; n < n0; n++) {
        const y = (Math.random() * 2 - 1) * Math.exp(-n / (tau * sr)) + a1 * y1 + a2 * y2;
        y2 = y1; y1 = y;
        tmp[n] = y; peak = Math.max(peak, Math.abs(y));
      }
      for (let n = 0; n < n0; n++) out[n] += tmp[n] * peakLevel / (peak || 1);
    };
    burst(lerp(1500, 3800, bright), 1.4, 0.9 * knock, 0.0025);
    burst(Math.min(900, freq * 1.8), 3, 0.7 * knock, 0.025);

    const fade = Math.min(len, Math.ceil(sr * 0.02));
    for (let n = 0; n < len; n++) out[n] *= 0.55 * (n >= len - fade ? (len - 1 - n) / fade : 1);

    const buffer = ctx.createBuffer(1, len, sr);
    buffer.getChannelData(0).set(out);
    return buffer;
  }

  function noteBuffer(freq) {
    const key = freq.toFixed(3);
    let buffer = noteCache.get(key);
    if (!buffer) { buffer = renderBar(freq, ctx.sampleRate, settings.sound); noteCache.set(key, buffer); }
    return buffer;
  }

  function prerender() {
    if (!ctx || sample) return;
    for (let i = 0; i < BAR_COUNT; i++) noteBuffer(frequency(i));
  }

  function roomImpulse(sr) {
    const len = Math.ceil(sr * 1.2);
    const ir = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const data = ir.getChannelData(c);
      let lp = 0;
      for (let n = 0; n < len; n++) {
        const t = n / sr;
        lp += (0.25 + 0.7 * Math.exp(-t / 0.2)) * ((Math.random() * 2 - 1) - lp);
        data[n] = t < 0.01 ? 0 : lp * Math.exp(-t / 0.25);
      }
    }
    return ir;
  }

  // iPhones mute Web Audio when the silent switch is on. Playing an inaudible <audio>
  // loop moves the page into "playback" mode, like a music app, which ignores the switch.
  let keepAlive = null;
  function silentWav() {
    const rate = 8000, samples = rate / 2; // half a second of 8-bit silence
    const bytes = new Uint8Array(44 + samples);
    const view = new DataView(bytes.buffer);
    const text = (at, str) => { for (let i = 0; i < str.length; i++) bytes[at + i] = str.charCodeAt(i); };
    text(0, "RIFF"); view.setUint32(4, 36 + samples, true); text(8, "WAVEfmt ");
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate, true);
    view.setUint16(32, 1, true); view.setUint16(34, 8, true);
    text(36, "data"); view.setUint32(40, samples, true);
    bytes.fill(128, 44);
    let binary = "";
    for (const b of bytes) binary += String.fromCharCode(b);
    return "data:audio/wav;base64," + btoa(binary);
  }
  function ignoreSilentSwitch() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (!keepAlive) {
      keepAlive = document.createElement("audio");
      keepAlive.setAttribute("playsinline", "");
      keepAlive.setAttribute("x-webkit-airplay", "deny");
      keepAlive.loop = true;
      keepAlive.src = silentWav();
    }
    if (keepAlive.paused && !document.hidden) keepAlive.play().catch(() => {});
  }

  function initAudio() {
    ignoreSilentSwitch();
    if (ctx) { if (ctx.state !== "running") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: "interactive" });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -6; comp.ratio.value = 4; comp.attack.value = 0.001; comp.release.value = 0.1;
    comp.connect(ctx.destination);
    master = ctx.createGain();
    master.gain.value = 0.8;
    master.connect(comp);
    const verb = ctx.createConvolver();
    verb.buffer = roomImpulse(ctx.sampleRate);
    wet = ctx.createGain();
    wet.gain.value = echoGain();
    master.connect(verb).connect(wet).connect(comp);
    ctx.resume();
    prerender();
    loadStoredSample();
  }
  const echoGain = () => (settings.sound.echo / 100) * 1.2;

  function playNote(bar, freq, velocity) {
    if (!ctx) return;
    const t = ctx.currentTime + 0.002;
    // A struck bar doesn't keep adding up: damp what is still ringing on this bar.
    const previous = lastVoice.get(bar);
    if (previous) {
      previous.gain.cancelScheduledValues(t);
      previous.gain.setValueAtTime(previous.gain.value, t);
      previous.gain.linearRampToValueAtTime(0, t + 0.015);
    }
    const src = ctx.createBufferSource();
    if (sample) {
      src.buffer = sample.buffer;
      src.playbackRate.value = freq / sample.pitch;
    } else {
      src.buffer = noteBuffer(freq);
    }
    const tone = ctx.createBiquadFilter();
    tone.type = "lowpass";
    tone.frequency.value = 1800 + 14000 * velocity * velocity; // softer hits sound duller
    const g = ctx.createGain();
    g.gain.value = Math.pow(velocity, 1.3) * (sample ? sample.gain : 1);
    src.connect(tone).connect(g).connect(master);
    src.start(t);
    lastVoice.set(bar, g);
    src.onended = () => { if (lastVoice.get(bar) === g) lastVoice.delete(bar); };
  }

  // ---------- Sound panel ----------
  const SLIDERS = {
    pitch: (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v) + " semitones",
    bright: (v) => v + "%", ring: (v) => v + "%", knock: (v) => v + "%", echo: (v) => v + "%"
  };
  function syncSliders() {
    for (const [key, fmt] of Object.entries(SLIDERS)) {
      $(key).value = settings.sound[key];
      $(key + "Out").textContent = fmt(settings.sound[key]);
    }
  }
  let rerenderTimer = 0;
  for (const [key, fmt] of Object.entries(SLIDERS)) {
    $(key).addEventListener("input", (e) => {
      settings.sound[key] = Number(e.target.value);
      $(key + "Out").textContent = fmt(settings.sound[key]);
      save();
      if (key === "echo") { if (wet) wet.gain.value = echoGain(); return; }
      if (key === "pitch") { prerender(); return; }
      clearTimeout(rerenderTimer);
      rerenderTimer = setTimeout(() => { noteCache = new Map(); prerender(); }, 120);
    });
  }
  $("resetSound").onclick = () => {
    settings.sound = { ...DEFAULT_SOUND };
    save(); syncSliders();
    if (wet) wet.gain.value = echoGain();
    noteCache = new Map(); prerender();
  };
  syncSliders();

  // ---------- Your own recording ----------
  const sampleStatus = $("sampleStatus");

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("ranad", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("files");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function storeSample(record) {
    try {
      const db = await openDb();
      const tx = db.transaction("files", "readwrite");
      if (record) tx.objectStore("files").put(record, "sample"); else tx.objectStore("files").delete("sample");
    } catch (e) {}
  }
  async function loadStoredSample() {
    try {
      const db = await openDb();
      const record = await new Promise((resolve) => {
        const req = db.transaction("files").objectStore("files").get("sample");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
      if (record && !sample) await useSample(record.bytes, record.name, false);
    } catch (e) {}
  }

  // Estimate the pitch of the strike by autocorrelation, just after the attack.
  function detectPitch(data, sr) {
    const start = Math.floor(sr * 0.02);
    const size = Math.min(4096, data.length - start - 1);
    if (size < 1024) return null;
    const minLag = Math.floor(sr / 3000), maxLag = Math.min(Math.floor(sr / 120), size - 1);
    let bestLag = -1, best = 0;
    const corr = new Float32Array(maxLag + 2);
    for (let lag = minLag; lag <= maxLag + 1; lag++) {
      let sum = 0, e1 = 0, e2 = 0;
      for (let i = 0; i < size - lag; i++) {
        const a = data[start + i], b = data[start + i + lag];
        sum += a * b; e1 += a * a; e2 += b * b;
      }
      corr[lag] = sum / (Math.sqrt(e1 * e2) || 1);
    }
    for (let lag = minLag + 1; lag <= maxLag; lag++) {
      if (corr[lag] > corr[lag - 1] && corr[lag] >= corr[lag + 1] && corr[lag] > best) { best = corr[lag]; bestLag = lag; }
    }
    // Prefer the first strong peak so an octave-down error isn't chosen.
    for (let lag = minLag + 1; lag <= maxLag; lag++) {
      if (corr[lag] > corr[lag - 1] && corr[lag] >= corr[lag + 1] && corr[lag] > best * 0.9) { bestLag = lag; break; }
    }
    if (bestLag < 0 || best < 0.5) return null;
    const a = corr[bestLag - 1], b = corr[bestLag], c = corr[bestLag + 1];
    const shift = (a - c) / (2 * (a - 2 * b + c) || 1);
    return sr / (bestLag + shift);
  }

  async function useSample(bytes, name, persist) {
    initAudio();
    sampleStatus.textContent = "Reading " + name + "…";
    let decoded;
    try {
      decoded = await new Promise((resolve, reject) => ctx.decodeAudioData(bytes.slice(0), resolve, reject));
    } catch (e) {
      sampleStatus.textContent = "That file couldn't be read as audio. Try an .m4a, .mp3 or .wav file.";
      return;
    }
    const sr = decoded.sampleRate;
    const mono = new Float32Array(decoded.length);
    for (let c = 0; c < decoded.numberOfChannels; c++) {
      const ch = decoded.getChannelData(c);
      for (let i = 0; i < ch.length; i++) mono[i] += ch[i] / decoded.numberOfChannels;
    }
    let peak = 0;
    for (const v of mono) peak = Math.max(peak, Math.abs(v));
    if (peak < 1e-4) { sampleStatus.textContent = "That recording is silent."; return; }
    // Trim to the strike and keep at most 3 seconds.
    let onset = 0;
    while (onset < mono.length && Math.abs(mono[onset]) < peak * 0.15) onset++;
    onset = Math.max(0, onset - Math.floor(sr * 0.004));
    const len = Math.min(mono.length - onset, Math.floor(sr * 3));
    const buffer = ctx.createBuffer(1, len, sr);
    const out = buffer.getChannelData(0);
    const fade = Math.min(len, Math.floor(sr * 0.08));
    for (let i = 0; i < len; i++) out[i] = (mono[onset + i] / peak) * 0.6 * (i >= len - fade ? (len - 1 - i) / fade : 1);
    const pitch = detectPitch(out, sr);
    if (!pitch) {
      sampleStatus.textContent = "Couldn't find a clear pitch in that recording. Try a single, clean strike.";
      return;
    }
    sample = { buffer, pitch, name, gain: 1 };
    noteCache = new Map();
    $("clearSample").hidden = false;
    sampleStatus.textContent = `Using ${name} (pitch ${Math.round(pitch)} Hz).`;
    if (persist) storeSample({ bytes, name });
  }

  $("sampleFile").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    hideStart();
    await useSample(await file.arrayBuffer(), file.name, true);
  });
  $("clearSample").onclick = () => {
    sample = null;
    $("clearSample").hidden = true;
    sampleStatus.textContent = "Using the built-in sound.";
    storeSample(null);
    prerender();
  };

  // ---------- Geometry (logical landscape space) ----------
  const canvas = $("ranad");
  const g2 = canvas.getContext("2d");
  let cssW = 0, cssH = 0, portrait = false, L = null;

  function layout(W, H) {
    const side = 12;
    const slot = (W - side * 2) / BAR_COUNT;
    const bw = slot * 0.86;
    // Every bar is the same length and sits on the same top and bottom line.
    const top = H * 0.04, h = H * 0.92;
    const bars = [];
    for (let i = 0; i < BAR_COUNT; i++) {
      const mx = side + slot * (i + 0.5);
      bars.push({ x: mx - bw / 2, y: top, w: bw, h, mx, my: top + h / 2 });
    }
    return { W, H, side, slot, bars };
  }

  function toLogical(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    const px = clientX - r.left, py = clientY - r.top;
    // In portrait the instrument is turned so the low bars sit at the bottom.
    return portrait ? { x: cssH - py, y: px } : { x: px, y: py };
  }

  function barAt(p) {
    if (!L) return null;
    const col = Math.floor((p.x - L.side) / L.slot);
    return col >= 0 && col < BAR_COUNT && p.y >= 0 && p.y <= L.H ? col : null;
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    cssW = r.width; cssH = r.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    portrait = cssH > cssW * 1.1;
    L = portrait ? layout(cssH, cssW) : layout(cssW, cssH);
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ---------- Drawing ----------
  const lit = new Map(); // bar -> time it was last struck
  const held = new Map(); // pointerId -> bar
  const FLASH_MS = 170;

  function roundRect(x, y, w, h, r) {
    g2.beginPath();
    g2.moveTo(x + r, y);
    g2.arcTo(x + w, y, x + w, y + h, r);
    g2.arcTo(x + w, y + h, x, y + h, r);
    g2.arcTo(x, y + h, x, y, r);
    g2.arcTo(x, y, x + w, y, r);
    g2.closePath();
  }

  function drawBars(now) {
    const heldBars = new Set(held.values());
    for (let i = 0; i < BAR_COUNT; i++) {
      const b = L.bars[i];
      const since = now - (lit.get(i) ?? -1e9);
      const glow = heldBars.has(i) ? 1 : Math.max(0, 1 - since / FLASH_MS);
      const s = 1 - 0.015 * glow;
      const w = b.w * s, h = b.h * s, x = b.mx - w / 2, y = b.my - h / 2;

      g2.save();
      g2.shadowColor = glow > 0 ? `rgba(226,179,74,${0.9 * glow})` : "rgba(0,0,0,0.55)";
      g2.shadowBlur = glow > 0 ? 14 * glow : 4;
      g2.shadowOffsetY = glow > 0 ? 0 : 3;
      roundRect(x, y, w, h, Math.min(w * 0.3, 14));
      const grad = g2.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, COLORS.barDark); grad.addColorStop(0.33, COLORS.barLight);
      grad.addColorStop(0.66, COLORS.barMid); grad.addColorStop(1, COLORS.barDark);
      g2.fillStyle = grad; g2.fill();
      g2.restore();

      if (glow > 0) { g2.fillStyle = `rgba(226,179,74,${0.45 * glow})`; g2.fill(); }
      g2.strokeStyle = "rgba(0,0,0,0.5)"; g2.lineWidth = 1; g2.stroke();

      if (settings.labels) {
        const text = (settings.thai ? THAI_NAMES : LATIN_NAMES)[i % 7];
        const size = settings.thai ? Math.max(12, Math.min(22, b.w * 0.62)) : Math.max(9, Math.min(15, b.w * 0.42));
        g2.save();
        g2.translate(b.mx, b.y + b.h * 0.76);
        if (portrait) g2.rotate(Math.PI / 2);
        g2.font = `600 ${size}px "IBM Plex Sans Thai", -apple-system, sans-serif`;
        g2.textAlign = "center"; g2.textBaseline = "middle";
        g2.fillStyle = COLORS.cream;
        g2.fillText(text, 0, 0, portrait ? b.w * 2.5 : b.w * 1.15);
        g2.restore();
      }
    }
  }

  function drawCords() {
    const bars = L.bars, first = bars[0], last = bars[BAR_COUNT - 1];
    g2.strokeStyle = COLORS.cord; g2.fillStyle = COLORS.cord; g2.lineWidth = 2;
    for (const f of [0.1, 0.9]) {
      const y = first.y + first.h * f;
      g2.beginPath(); g2.moveTo(first.x - 4, y); g2.lineTo(last.x + last.w + 4, y); g2.stroke();
      for (const b of bars) { g2.beginPath(); g2.arc(b.mx, y, 2.5, 0, Math.PI * 2); g2.fill(); }
    }
  }

  let frame = 0;
  function draw() {
    if (frame) return;
    frame = requestAnimationFrame(render);
  }
  function render() {
    frame = 0;
    if (!L) return;
    const now = performance.now();
    g2.save();
    g2.clearRect(0, 0, cssW, cssH);
    if (portrait) { g2.translate(0, cssH); g2.rotate(-Math.PI / 2); }
    drawBars(now);
    drawCords();
    g2.restore();
    for (const t of lit.values()) if (now - t < FLASH_MS) { draw(); break; }
  }

  // ---------- Playing ----------
  function strike(bar, velocity) {
    playNote(bar, frequency(bar), velocity);
    lit.set(bar, performance.now());
    if (settings.octaves) {
      const partner = bar >= 7 ? bar - 7 : bar + 7;
      playNote(partner, frequency(partner), velocity * 0.85);
      lit.set(partner, performance.now());
    }
    draw();
  }
  const rand = (a, b) => a + Math.random() * (b - a);

  canvas.addEventListener("pointerdown", (e) => {
    initAudio();
    canvas.setPointerCapture?.(e.pointerId);
    const bar = barAt(toLogical(e.clientX, e.clientY));
    held.set(e.pointerId, bar);
    if (bar !== null) strike(bar, rand(0.85, 1));
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!held.has(e.pointerId)) return;
    const bar = barAt(toLogical(e.clientX, e.clientY));
    if (bar === held.get(e.pointerId)) return;
    held.set(e.pointerId, bar);
    if (bar !== null) strike(bar, rand(0.65, 0.8)); // glissando stroke
    else draw();
  });
  const release = (e) => { held.delete(e.pointerId); draw(); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // Kro (กรอ): hold a bar to roll a fast tremolo.
  setInterval(() => {
    if (!settings.kro) return;
    for (const bar of new Set(held.values())) if (bar !== null) strike(bar, rand(0.55, 0.75));
  }, 1000 / 14);

  // Computer keyboard: Z–M, A–L, then Q–P play the bars from low to high.
  const KEYS = "zxcvbnmasdfghjklqwertyui";
  const down = new Set();
  window.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement) return;
    const i = KEYS.indexOf(e.key.toLowerCase());
    if (i < 0 || i >= BAR_COUNT || down.has(i) || e.metaKey || e.ctrlKey) return;
    down.add(i); initAudio(); hideStart(); strike(i, 0.9);
  });
  window.addEventListener("keyup", (e) => down.delete(KEYS.indexOf(e.key.toLowerCase())));

  const start = $("start");
  function hideStart() { start.hidden = true; }
  $("startButton").addEventListener("click", () => {
    initAudio();
    hideStart();
    strike(3, 0.8);
  });
  document.addEventListener("visibilitychange", () => {
    // Stop the silent loop in the background so it doesn't keep the phone's audio busy.
    if (document.hidden) { if (keepAlive) keepAlive.pause(); return; }
    if (keepAlive) keepAlive.play().catch(() => {});
    if (ctx && ctx.state !== "running") ctx.resume();
  });

  syncChips();
  new ResizeObserver(resize).observe($("stage"));
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
