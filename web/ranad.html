<title>Ranad Ek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Sans+Thai:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg-top: #3A0D12;
    --bg-bottom: #120405;
    --gold: #E2B34A;
    --cream: #F7EBD3;
    --cream-dim: #CDB9A0;
    --chip: rgba(247, 235, 211, 0.08);
    --ui: "IBM Plex Sans Thai", -apple-system, "Segoe UI", system-ui, sans-serif;
    --display: "Chonburi", "Thonburi", Georgia, serif;
  }
  html, body { height: 100%; }
  body {
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    background-color: var(--bg-bottom);
    color: var(--cream);
    font-family: var(--ui);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px 4px;
    box-sizing: border-box;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
  }
  .name { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .name h1 {
    margin: 0;
    font: 400 22px/1.2 var(--display);
    color: var(--gold);
  }
  .name span { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cream-dim); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 600 13px/1 var(--ui);
    color: var(--cream);
    background: var(--chip);
    border: 1px solid rgba(226, 179, 74, 0.55);
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chip[aria-pressed="true"] { background: var(--gold); color: var(--bg-bottom); border-color: var(--gold); }
  .chip:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
  .stage { position: relative; flex: 1; min-height: 0; margin-top: 6px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .start {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(18, 4, 5, 0.55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .start button {
    display: grid; gap: 6px; justify-items: center;
    font: 600 17px/1.3 var(--ui);
    color: var(--bg-bottom);
    background: var(--gold);
    border: 0; border-radius: 18px;
    padding: 18px 28px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .start button small { font-weight: 500; font-size: 13px; opacity: 0.8; }
</style>

<div class="app">
  <header>
    <div class="name"><h1>ระนาดเอก</h1><span>Ranad Ek</span></div>
    <div class="controls">
      <button class="chip" id="labels" aria-pressed="true">Labels</button>
      <button class="chip" id="script" aria-pressed="true">ไทย</button>
      <button class="chip" id="octaves" aria-pressed="false">Octaves</button>
      <button class="chip" id="kro" aria-pressed="false">Kro</button>
      <button class="chip" id="tuning" aria-pressed="false">Thai tuning</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="ranad" aria-label="Ranad ek with 21 wooden bars. Tap a bar to play it."></canvas>
    <div class="start" id="start">
      <button id="startButton">Tap to start playing<small>If you hear nothing, turn off silent mode</small></button>
    </div>
  </div>
</div>

<script>
(() => {
  const BAR_COUNT = 21;
  const LOWEST = 330;
  const THAI_NAMES = ["โด", "เร", "มี", "ฟา", "ซอล", "ลา", "ที"];
  const LATIN_NAMES = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Ti"];
  const MAJOR = [0, 2, 4, 5, 7, 9, 11];
  const COLORS = {
    gold: "#E2B34A", cream: "#F7EBD3",
    barDark: "#6B3419", barMid: "#9C5630", barLight: "#C98552",
    hull: "#6A2E14", hullDark: "#2E1208", cord: "#2A1A10"
  };

  // ---------- Settings ----------
  const settings = { labels: true, thai: true, octaves: false, kro: false, western: false };
  try { Object.assign(settings, JSON.parse(localStorage.getItem("ranad-settings") || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem("ranad-settings", JSON.stringify(settings)); } catch (e) {} };

  const chips = {
    labels: document.getElementById("labels"),
    script: document.getElementById("script"),
    octaves: document.getElementById("octaves"),
    kro: document.getElementById("kro"),
    tuning: document.getElementById("tuning")
  };
  function syncChips() {
    chips.labels.setAttribute("aria-pressed", settings.labels);
    chips.script.hidden = !settings.labels;
    chips.script.textContent = settings.thai ? "ไทย" : "ABC";
    chips.script.setAttribute("aria-pressed", "true");
    chips.octaves.setAttribute("aria-pressed", settings.octaves);
    chips.kro.setAttribute("aria-pressed", settings.kro);
    chips.tuning.textContent = settings.western ? "Western tuning" : "Thai tuning";
    chips.tuning.setAttribute("aria-pressed", settings.western);
  }
  const toggle = (key) => () => { settings[key] = !settings[key]; save(); syncChips(); draw(); };
  chips.labels.onclick = toggle("labels");
  chips.script.onclick = toggle("thai");
  chips.octaves.onclick = toggle("octaves");
  chips.kro.onclick = toggle("kro");
  chips.tuning.onclick = () => { toggle("western")(); if (ctx) for (let i = 0; i < BAR_COUNT; i++) noteBuffer(frequency(i)); };
  syncChips();

  function frequency(bar) {
    if (!settings.western) return LOWEST * Math.pow(2, bar / 7);
    const semis = MAJOR[bar % 7] + 12 * Math.floor(bar / 7);
    return LOWEST * Math.pow(2, semis / 12);
  }

  // ---------- Audio: struck ranad bar ----------
  // Each note is rendered once into a buffer: the bar's resonant modes, excited by a
  // hard mallet, plus the wooden "tak" of the strike and a knock from the wooden body.
  // Playback runs through a short room reverb.
  let ctx = null, master = null, dry = null;
  const noteCache = new Map();
  const lastVoice = new Map();

  // [frequency ratio, level, decay relative to the fundamental]
  const MODES = [
    [1.000, 1.00, 1.00],
    [1.004, 0.30, 0.85],  // a near-twin mode: the slight shimmer of a hand-tuned bar
    [2.920, 0.62, 0.38],  // the strong, bright first overtone
    [3.050, 0.16, 0.30],
    [5.830, 0.30, 0.16],
    [9.200, 0.12, 0.08]
  ];

  function renderBar(freq, sr) {
    const tau0 = Math.max(0.10, Math.min(0.55, 0.5 * Math.pow(330 / freq, 0.75)));
    const len = Math.ceil(sr * (tau0 * 5 + 0.1));
    const out = new Float32Array(len);
    const contact = 0.00045; // seconds a hard mallet stays on the bar
    const rise = 0.00015 * sr;

    for (const [ratio, level, decay] of MODES) {
      const f = freq * ratio;
      if (f > sr * 0.45) continue;
      // Spectrum of a short half-sine mallet pulse: harder mallets excite higher modes.
      const x = 2 * f * contact;
      const mallet = Math.abs(x) > 0.999 && Math.abs(x) < 1.001
        ? Math.PI / 4 : Math.abs(Math.cos(Math.PI * f * contact) / (1 - x * x));
      const amp = level * mallet;
      const w = 2 * Math.PI * f / sr;
      const d = Math.exp(-1 / (tau0 * decay * sr));
      let env = amp;
      for (let n = 0; n < len; n++) {
        out[n] += env * Math.sin(w * n) * (1 - Math.exp(-n / rise));
        env *= d;
        if (env < 1e-5) break;
      }
    }

    // The "tak" of wood on wood: noise through a resonant band-pass.
    const fc = Math.min(4200, 2200 + freq), q = 1.2;
    const w0 = 2 * Math.PI * fc / sr, r = Math.exp(-w0 / (2 * q));
    const a1 = 2 * r * Math.cos(w0), a2 = -r * r;
    let y1 = 0, y2 = 0, clickEnv = 0.45;
    const clickDecay = Math.exp(-1 / (0.0035 * sr));
    const clickLen = Math.min(len, Math.ceil(sr * 0.03));
    for (let n = 0; n < clickLen; n++) {
      const y = (1 - r) * (Math.random() * 2 - 1) + a1 * y1 + a2 * y2;
      y2 = y1; y1 = y;
      out[n] += y * clickEnv * 3;
      clickEnv *= clickDecay;
    }

    // Hollow knock of the boat-shaped wooden body.
    const bodyW = 2 * Math.PI * 190 / sr, bodyDecay = Math.exp(-1 / (0.05 * sr));
    let bodyEnv = 0.14;
    for (let n = 0; n < len && bodyEnv > 1e-5; n++) {
      out[n] += bodyEnv * Math.sin(bodyW * n);
      bodyEnv *= bodyDecay;
    }

    let peak = 0;
    for (let n = 0; n < len; n++) peak = Math.max(peak, Math.abs(out[n]));
    const norm = 0.8 / (peak || 1);
    for (let n = 0; n < len; n++) out[n] *= norm;
    // Short fade at the tail so nothing clicks off.
    const fade = Math.min(len, Math.ceil(sr * 0.02));
    for (let n = 0; n < fade; n++) out[len - 1 - n] *= n / fade;

    const buffer = ctx.createBuffer(1, len, sr);
    buffer.getChannelData(0).set(out);
    return buffer;
  }

  function noteBuffer(freq) {
    const key = freq.toFixed(3);
    let buffer = noteCache.get(key);
    if (!buffer) { buffer = renderBar(freq, ctx.sampleRate); noteCache.set(key, buffer); }
    return buffer;
  }

  function roomImpulse(sr) {
    const len = Math.ceil(sr * 1.3);
    const ir = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const data = ir.getChannelData(c);
      let lp = 0;
      for (let n = 0; n < len; n++) {
        const t = n / sr;
        const k = 0.25 + 0.7 * Math.exp(-t / 0.25); // darker as it decays
        lp += k * ((Math.random() * 2 - 1) - lp);
        data[n] = lp * Math.exp(-t / 0.28) * (t < 0.012 ? 0 : 1);
      }
    }
    return ir;
  }

  function initAudio() {
    if (ctx) { if (ctx.state !== "running") ctx.resume(); return; }
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: "interactive" });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -8; comp.ratio.value = 4; comp.attack.value = 0.001; comp.release.value = 0.12;
    comp.connect(ctx.destination);
    master = ctx.createGain();
    master.gain.value = 0.55;
    dry = ctx.createGain();
    master.connect(dry).connect(comp);
    const verb = ctx.createConvolver();
    verb.buffer = roomImpulse(ctx.sampleRate);
    const wet = ctx.createGain();
    wet.gain.value = 0.35;
    master.connect(verb).connect(wet).connect(comp);
    ctx.resume();
    for (let i = 0; i < BAR_COUNT; i++) noteBuffer(frequency(i));
  }

  function playNote(bar, freq, velocity) {
    if (!ctx) return;
    const t = ctx.currentTime + 0.002;
    // A struck bar doesn't keep adding up: damp what is still ringing on this bar.
    const previous = lastVoice.get(bar);
    if (previous) {
      previous.gain.cancelScheduledValues(t);
      previous.gain.setValueAtTime(previous.gain.value, t);
      previous.gain.linearRampToValueAtTime(0, t + 0.015);
    }
    const src = ctx.createBufferSource();
    src.buffer = noteBuffer(freq);
    const tone = ctx.createBiquadFilter();
    tone.type = "lowpass";
    tone.frequency.value = 1800 + 14000 * velocity * velocity; // softer hits sound duller
    const g = ctx.createGain();
    g.gain.value = Math.pow(velocity, 1.3);
    src.connect(tone).connect(g).connect(master);
    src.start(t);
    lastVoice.set(bar, g);
    src.onended = () => { if (lastVoice.get(bar) === g) lastVoice.delete(bar); };
  }

  // ---------- Geometry (logical landscape space) ----------
  const canvas = document.getElementById("ranad");
  const g2 = canvas.getContext("2d");
  let cssW = 0, cssH = 0, portrait = false, L = null;

  function layout(W, H) {
    const side = 12;
    const slot = (W - side * 2) / BAR_COUNT;
    const bw = slot * 0.86;
    const top = H * 0.04, h = H * 0.92;
    const bars = [];
    for (let i = 0; i < BAR_COUNT; i++) {
      const mx = side + slot * (i + 0.5);
      bars.push({ x: mx - bw / 2, y: top, w: bw, h, mx, my: top + h / 2 });
    }
    return { W, H, side, slot, bars };
  }

  function toLogical(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    const px = clientX - r.left, py = clientY - r.top;
    // In portrait the instrument is turned so the low bars sit at the bottom.
    return portrait ? { x: cssH - py, y: px } : { x: px, y: py };
  }

  function barAt(p) {
    if (!L) return null;
    const col = Math.floor((p.x - L.side) / L.slot);
    if (col < 0 || col >= BAR_COUNT) return null;
    const b = L.bars[col];
    const padX = (L.slot - b.w) / 2 + 1;
    return (p.x >= b.x - padX && p.x <= b.x + b.w + padX && p.y >= 0 && p.y <= L.H) ? col : null;
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    cssW = r.width; cssH = r.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    portrait = cssH > cssW * 1.1;
    L = portrait ? layout(cssH, cssW) : layout(cssW, cssH);
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ---------- Drawing ----------
  const lit = new Map(); // bar -> time it was last struck
  const held = new Map(); // pointerId -> bar
  const FLASH_MS = 170;

  function roundRect(x, y, w, h, r) {
    g2.beginPath();
    g2.moveTo(x + r, y);
    g2.arcTo(x + w, y, x + w, y + h, r);
    g2.arcTo(x + w, y + h, x, y + h, r);
    g2.arcTo(x, y + h, x, y, r);
    g2.arcTo(x, y, x + w, y, r);
    g2.closePath();
  }

  function drawBars(now) {
    const heldBars = new Set(held.values());
    for (let i = 0; i < BAR_COUNT; i++) {
      const b = L.bars[i];
      const since = now - (lit.get(i) ?? -1e9);
      const glow = heldBars.has(i) ? 1 : Math.max(0, 1 - since / FLASH_MS);
      const s = 1 - 0.04 * glow;
      const w = b.w * s, h = b.h * s, x = b.mx - w / 2, y = b.my - h / 2;
      const r = w * 0.3;

      g2.save();
      g2.shadowColor = glow > 0 ? `rgba(226,179,74,${0.9 * glow})` : "rgba(0,0,0,0.55)";
      g2.shadowBlur = glow > 0 ? 14 * glow : 4;
      g2.shadowOffsetY = glow > 0 ? 0 : 3;
      roundRect(x, y, w, h, r);
      const grad = g2.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, COLORS.barDark); grad.addColorStop(0.33, COLORS.barLight);
      grad.addColorStop(0.66, COLORS.barMid); grad.addColorStop(1, COLORS.barDark);
      g2.fillStyle = grad; g2.fill();
      g2.restore();

      if (glow > 0) { g2.fillStyle = `rgba(226,179,74,${0.45 * glow})`; g2.fill(); }
      g2.strokeStyle = "rgba(0,0,0,0.5)"; g2.lineWidth = 1; g2.stroke();

      if (settings.labels) {
        const text = (settings.thai ? THAI_NAMES : LATIN_NAMES)[i % 7];
        const size = Math.max(9, Math.min(15, b.w * 0.45));
        g2.save();
        g2.translate(b.mx, b.y + b.h * 0.76);
        if (portrait) g2.rotate(Math.PI / 2);
        g2.font = `600 ${size}px "IBM Plex Sans Thai", -apple-system, sans-serif`;
        g2.textAlign = "center"; g2.textBaseline = "middle";
        g2.fillStyle = COLORS.cream;
        g2.fillText(text, 0, 0, portrait ? b.w * 2.5 : b.w * 1.15);
        g2.restore();
      }
    }
  }

  function drawCords() {
    const { slot, bars } = L;
    const first = bars[0], last = bars[BAR_COUNT - 1];
    g2.strokeStyle = COLORS.cord; g2.fillStyle = COLORS.cord; g2.lineWidth = 2;
    for (const f of [0.1, 0.9]) {
      g2.beginPath();
      g2.moveTo(first.x - 4, first.y + first.h * f);
      for (const b of bars) g2.lineTo(b.mx, b.y + b.h * f);
      g2.lineTo(last.x + last.w + 4, last.y + last.h * f);
      g2.stroke();
      for (const b of bars) { g2.beginPath(); g2.arc(b.mx, b.y + b.h * f, 2.5, 0, Math.PI * 2); g2.fill(); }
    }
  }

  let frame = 0;
  function draw() {
    if (frame) return;
    frame = requestAnimationFrame(render);
  }
  function render() {
    frame = 0;
    if (!L) return;
    const now = performance.now();
    g2.save();
    g2.clearRect(0, 0, cssW, cssH);
    if (portrait) { g2.translate(0, cssH); g2.rotate(-Math.PI / 2); }
    drawBars(now);
    drawCords();
    g2.restore();
    for (const t of lit.values()) if (now - t < FLASH_MS) { draw(); break; }
  }

  // ---------- Playing ----------
  function strike(bar, velocity) {
    playNote(bar, frequency(bar), velocity);
    lit.set(bar, performance.now());
    if (settings.octaves) {
      const partner = bar >= 7 ? bar - 7 : bar + 7;
      playNote(partner, frequency(partner), velocity * 0.85);
      lit.set(partner, performance.now());
    }
    draw();
  }
  const rand = (a, b) => a + Math.random() * (b - a);

  canvas.addEventListener("pointerdown", (e) => {
    initAudio();
    canvas.setPointerCapture?.(e.pointerId);
    const bar = barAt(toLogical(e.clientX, e.clientY));
    held.set(e.pointerId, bar);
    if (bar !== null) strike(bar, rand(0.85, 1));
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!held.has(e.pointerId)) return;
    const bar = barAt(toLogical(e.clientX, e.clientY));
    if (bar === held.get(e.pointerId)) return;
    held.set(e.pointerId, bar);
    if (bar !== null) strike(bar, rand(0.65, 0.8)); // glissando stroke
    else draw();
  });
  const release = (e) => { held.delete(e.pointerId); draw(); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // Kro (กรอ): hold a bar to roll a fast tremolo.
  setInterval(() => {
    if (!settings.kro) return;
    for (const bar of new Set(held.values())) if (bar !== null) strike(bar, rand(0.55, 0.75));
  }, 1000 / 14);

  // Computer keyboard: Z–M, A–L, then Q–U play the bars from low to high.
  const KEYS = "zxcvbnmasdfghjklqwertyu";
  const down = new Set();
  window.addEventListener("keydown", (e) => {
    const i = KEYS.indexOf(e.key.toLowerCase());
    if (i < 0 || i >= BAR_COUNT || down.has(i) || e.metaKey || e.ctrlKey) return;
    down.add(i); initAudio(); hideStart(); strike(i, 0.9);
  });
  window.addEventListener("keyup", (e) => down.delete(KEYS.indexOf(e.key.toLowerCase())));

  const start = document.getElementById("start");
  function hideStart() { start.hidden = true; }
  document.getElementById("startButton").addEventListener("click", () => {
    initAudio();
    hideStart();
    strike(7, 0.8);
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && ctx && ctx.state !== "running") ctx.resume();
  });

  new ResizeObserver(resize).observe(document.getElementById("stage"));
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
